name: Build Release APK

# Triggers whenever a NEW GitHub Release is published. The action
# builds the release APK, signs it (using either a long-lived keystore
# stored as a repo secret, or a freshly-generated debug-grade keystore
# on first run), and attaches the resulting .apk to the release.
#
# Manual dispatch is also supported via the GitHub Actions tab.
#
# v0.0.7 changes:
#  - Default `tag_name` input updated to v0.0.7 (was v0.0.6).
#
# v0.0.8 changes:
#  - Default `tag_name` input updated to v0.0.8 (was v0.0.7).
#  - Made CI a required gate: the release build is skipped (and a
#    clear error is printed) if the latest CI run on the same SHA
#    didn't succeed. This prevents attaching a broken APK to a
#    release when the user publishes a tag between CI runs.
#  - Added an explicit lintDebug step (mirrors the CI workflow) so
#    lint regressions are caught here too.
#  - Bumped Java to JDK 21 (LTS, faster than 17 + matches the
#    Temurin distribution's recommended LTS for AGP 8.7+).
#  - Trimmed cache restore-keys to one entry to reduce cache
#    thrash on cold builds.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to attach the APK to (must already exist)'
        required: true
        default: 'v0.0.8'

jobs:
  build:
    name: Build, sign, and upload release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # required to upload assets to the release
      actions: read    # required to query the latest CI run status

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history so we can read CHANGELOG.md
          # On `release.published`, GitHub sets GITHUB_REF to the tag.
          # On `workflow_dispatch`, the user passes a tag_name input.
          # In both cases we want to build the source that the release
          # points at, not the latest commit on the default branch.
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify CI passed on this commit
        # v0.0.8 — refuse to build a release APK if the latest CI
        # run on the same SHA failed. This catches broken releases
        # before the user gets a 0-byte APK asset attached.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Checking CI status on $SHA..."
          # Query the latest CI workflow run for this SHA.
          LATEST=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch "$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)" \
            --limit 1 \
            --json conclusion,status,headSha,databaseId \
            2>/dev/null || echo "")
          if [ -z "$LATEST" ] || [ "$LATEST" = "[]" ]; then
            echo "::warning::No CI run found — proceeding (this is normal for the very first release on a new branch)."
            exit 0
          fi
          CONCLUSION=$(echo "$LATEST" | jq -r '.[0].conclusion // empty')
          RUN_SHA=$(echo "$LATEST" | jq -r '.[0].headSha // empty')
          if [ "$RUN_SHA" != "$SHA" ]; then
            echo "::warning::Latest CI run was on $RUN_SHA, not $SHA — proceeding."
            exit 0
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Latest CI run on $SHA did not succeed (conclusion=$CONCLUSION). Refusing to publish a broken release."
            exit 1
          fi
          echo "Latest CI run on $SHA succeeded. Proceeding with release build."

      - name: Resolve release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIPC_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.VIPC_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIPC_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VIPC_SIGNING_KEY_PASSWORD }}
        run: |
          # If the user has stored a long-lived keystore as a base64
          # secret (VIPC_RELEASE_KEYSTORE_BASE64), decode it. Otherwise
          # generate a fresh debug-grade keystore — the resulting APK
          # will still install, but upgrades across releases will need
          # an uninstall first because the key changes.
          KS_PATH="$RUNNER_TEMP/vipercode.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "::notice::Using persistent release keystore from VIPC_RELEASE_KEYSTORE_BASE64 secret"
          else
            keytool -genkey -v \
              -keystore "$KS_PATH" \
              -storepass android \
              -alias vipercode \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ViperCode,O=hieulouisdev,C=VN"
            echo "::warning::No VIPC_RELEASE_KEYSTORE_BASE64 secret found — generated a fresh debug-grade keystore. Add the secret for stable upgrades across releases."
          fi
          echo "store_path=$KS_PATH" >> "$GITHUB_OUTPUT"
          echo "store_pass=${STORE_PASS:-android}" >> "$GITHUB_OUTPUT"
          echo "key_alias=${KEY_ALIAS:-vipercode}" >> "$GITHUB_OUTPUT"
          echo "key_pass=${KEY_PASS:-android}" >> "$GITHUB_OUTPUT"

      - name: Lint (mirror CI)
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          VIPC_SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_path }}
          VIPC_SIGNING_STORE_PASSWORD: ${{ steps.keystore.outputs.store_pass }}
          VIPC_SIGNING_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          VIPC_SIGNING_KEY_PASSWORD: ${{ steps.keystore.outputs.key_pass }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Resolve APK metadata
        id: meta
        run: |
          # The release tag name is either the GitHub event tag (for
          # `release.published`) or the manual input (for
          # `workflow_dispatch`). Default to v0.0.8.
          TAG_NAME="${{ github.event.release.tag_name || inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v0.0.8"
          fi
          # Strip leading "v" for the bare version string.
          VERSION="${TAG_NAME#v}"
          APK_NAME="ViperCode-${TAG_NAME}.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$SIGNED_APK" ]; then
            APK_SRC="$SIGNED_APK"
          elif [ -f "$UNSIGNED_APK" ]; then
            APK_SRC="$UNSIGNED_APK"
            echo "::warning::No signed APK found — falling back to unsigned. The APK will not be installable until it is signed with apksigner."
          else
            echo "::error::No APK found at app/build/outputs/apk/release/"
            ls -la app/build/outputs/apk/release/ 2>&1 || true
            exit 1
          fi
          cp "$APK_SRC" "app/build/outputs/apk/release/${APK_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/release/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature (best-effort)
        continue-on-error: true
        run: |
          BUILD_TOOLS_DIR=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.meta.outputs.apk_path }}" || true

      - name: Read release notes from CHANGELOG.md
        if: ${{ !github.event.release.body }}
        id: notes
        run: |
          # Extract the section of CHANGELOG.md that matches the tag.
          # CHANGELOG.md format:
          #   ## [v0.0.5] - 2026-08-22
          #   ### Added
          #   - ...
          #   ## [v0.0.4] - 2026-07-01
          #   ...
          # We grab everything between the matching header and the
          # next "## [" header.
          TAG="${{ steps.meta.outputs.tag_name }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found — using minimal release notes."
            printf 'ViperCode %s release build.\n' "$TAG" > /tmp/release_body.md
            echo "body_path=/tmp/release_body.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use awk to extract the section. The regex matches both
          # "## [v0.0.5]" and "## v0.0.5" headers.
          BODY=$(awk -v tag="$TAG" '
            BEGIN { in_section=0 }
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" tag "]") > 0) { in_section=1; next }
            }
            /^## / && !/^\#\# \[/ {
              if (in_section) exit
              if (index($0, tag) > 0) { in_section=1; next }
            }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="ViperCode ${TAG} release build."
          fi
          # Write to a file so the next step can read it (avoid shell
          # quoting issues with multi-line strings).
          printf '%s\n' "$BODY" > /tmp/release_body.md
          echo "body_path=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: ${{ steps.meta.outputs.apk_path }}
          # Only pass body_path when the release doesn't already have
          # a body (typed by the user in the GitHub UI). When
          # body_path is unset and `body` is unset, the action
          # preserves the existing release body.
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as build artifact
        if: always() && steps.meta.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_path }}
          if-no-files-found: warn
          retention-days: 30

