name: Build Release APK

# Triggers whenever a NEW GitHub Release is published. The action
# builds the release APK, signs it (using either a long-lived keystore
# stored as a repo secret, or a freshly-generated debug-grade keystore
# on first run), and attaches the resulting .apk to the release.
#
# Manual dispatch is also supported via the GitHub Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to attach the APK to (must already exist)'
        required: true
        default: 'v0.0.3'

jobs:
  build:
    name: Build, sign, and upload release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload assets to the release

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIPC_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.VIPC_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIPC_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VIPC_SIGNING_KEY_PASSWORD }}
        run: |
          # If the user has stored a long-lived keystore as a base64
          # secret (VIPC_RELEASE_KEYSTORE_BASE64), decode it. Otherwise
          # generate a fresh debug-grade keystore — the resulting APK
          # will still install, but upgrades across releases will need
          # an uninstall first because the key changes.
          KS_PATH="$RUNNER_TEMP/vipercode.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "::notice::Using persistent release keystore from VIPC_RELEASE_KEYSTORE_BASE64 secret"
          else
            keytool -genkey -v \
              -keystore "$KS_PATH" \
              -storepass android \
              -alias vipercode \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ViperCode,O=hieulouisdev,C=VN"
            echo "::warning::No VIPC_RELEASE_KEYSTORE_BASE64 secret found — generated a fresh debug-grade keystore. Add the secret for stable upgrades across releases."
          fi
          echo "store_path=$KS_PATH" >> "$GITHUB_OUTPUT"
          echo "store_pass=${STORE_PASS:-android}" >> "$GITHUB_OUTPUT"
          echo "key_alias=${KEY_ALIAS:-vipercode}" >> "$GITHUB_OUTPUT"
          echo "key_pass=${KEY_PASS:-android}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          VIPC_SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_path }}
          VIPC_SIGNING_STORE_PASSWORD: ${{ steps.keystore.outputs.store_pass }}
          VIPC_SIGNING_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          VIPC_SIGNING_KEY_PASSWORD: ${{ steps.keystore.outputs.key_pass }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Resolve APK metadata
        id: meta
        run: |
          # The release tag name is either the GitHub event tag (for
          # `release.published`) or the manual input (for
          # `workflow_dispatch`). Default to v0.0.3.
          TAG_NAME="${{ github.event.release.tag_name || inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v0.0.3"
          fi
          # Strip leading "v" for the bare version string.
          VERSION="${TAG_NAME#v}"
          APK_NAME="ViperCode-${TAG_NAME}.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$SIGNED_APK" ]; then
            APK_SRC="$SIGNED_APK"
          elif [ -f "$UNSIGNED_APK" ]; then
            APK_SRC="$UNSIGNED_APK"
          else
            echo "No APK found at app/build/outputs/apk/release/" >&2
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK_SRC" "app/build/outputs/apk/release/${APK_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/release/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature (best-effort)
        continue-on-error: true
        run: |
          BUILD_TOOLS_DIR=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.meta.outputs.apk_path }}" || true

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: ${{ steps.meta.outputs.apk_path }}
          body: |
            ## ViperCode ${{ steps.meta.outputs.tag_name }}

            **Installable APK** (release variant, signed).

            ### Installation
            1. Download `${{ steps.meta.outputs.apk_name }}` below.
            2. On Android 8+: allow "Install unknown apps" for your browser, then tap the downloaded APK.
            3. Min Android 7.1.1 (API 25) required.

            ### What's new in v0.0.3
            - **Bug fixes**: highlight overlay no longer drifts on scroll; line numbers stay aligned with text; caret position preserved across tab switches; `SettingsRepository.now()` no longer blocks main thread; `FileUtils` no longer swallows `CancellationException`; back button flushes auto-save before navigating away; subsequent ACTION_VIEW intents now navigate correctly.
            - **Live preview**: WebView-backed HTML/CSS/JS preview screen — open an HTML file, tap the play icon in the editor's top bar, and the rendered output appears immediately. Auto-refreshes 600 ms after you stop typing.
            - **Find & Replace upgrade**: regex toggle, case-sensitivity toggle, find-next / find-prev navigation, live match counter, per-match replace.
            - **Multi-tab UX**: TabChip max-width capped at 180 dp so long file names no longer push other tabs off-screen.
            - **Syntax hints**: bracket matching highlights the pair at the caret; unbalanced open brackets get a red underline; `@` followed by a non-identifier is no longer mis-highlighted as an annotation.
            - **FileExplorer rewrite**: flattened LazyColumn — full virtualization for large workspaces (no more lag on 1000+ file trees).
            - **Smart indent**: extra indent after `{`/`(`/`[` now respects the user's `tabSize` setting instead of always being 4 spaces.
            - **CI/CD**: GitHub Action auto-builds this APK on every new release publish.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_path }}
          if-no-files-found: warn
          retention-days: 30
