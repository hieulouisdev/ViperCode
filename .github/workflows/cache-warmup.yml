name: Dependency Cache Warm-up

# v0.0.9 — new workflow. Pre-warms the shared Gradle cache on a
# schedule (every night at 03:00 UTC) so the FIRST push of the day
# doesn't pay the cold-start cost (~3-5 min on a fresh runner).
#
# The job downloads all Gradle dependencies + the Android SDK
# components + the Kotlin compiler, then exits. The cache hit on the
# next CI run is what saves the time.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: dep-cache
  cancel-in-progress: false

jobs:
  warm-cache:
    name: Warm Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Download all dependencies without building anything. This is
      # the cheapest possible "make the cache hot" step.
      - name: Resolve dependencies
        run: ./gradlew dependencies --no-daemon --build-cache --configuration releaseRuntimeClasspath || true

      - name: Resolve Android dependencies
        run: ./gradlew :app:dependencies --no-daemon --build-cache --configuration debugRuntimeClasspath || true
