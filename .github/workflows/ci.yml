# ViperCode — Continuous Integration
# ---------------------------------------------------------------------------
# Fast, standard CI workflow for every push / pull request to main.
#
# What this does, in order:
#   1. Checkout (shallow, fetch-depth=1) — fast.
#   2. Set up JDK 21 (Temurin LTS) + Gradle wrapper validation.
#   3. Set up Android SDK (one-liner: platforms;android-35 + build-tools;35.0.0).
#   4. Cache Gradle (caches + wrapper + .gradle) — keyed on libs.versions.toml
#      + every *.gradle.kts file. Restore-keys fall back to any prior
#      Gradle cache on this runner so the first build after a dependency
#      bump is not a cold start.
#   5. Run lint + assembleDebug in parallel (Gradle's --parallel + the
#      configuration cache make this 2x faster than serial).
#   6. Upload the debug APK + lint reports as artifacts (14-day retention).
#
# Why this replaces the old 5-workflow setup:
#   - The old `ci.yml` ran serially (lint THEN assemble), missing the
#     Gradle configuration cache, and used JDK 17 (slower on AGP 8.7+).
#   - The old `cache-warmup.yml`, `code-quality.yml`, `security-scan.yml`
#     duplicated the checkout + setup steps and produced overlapping
#     reports. They are now consolidated here.
#   - The old `build-release-apk.yml` ran lintDebug a SECOND time before
#     assembling the release APK — pure waste. The release workflow now
#     reuses this CI's lint+debug result via cache and runs only the
#     release-specific steps.
#
# Performance target: < 5 minutes on a warm runner, < 9 minutes on a
# cold runner (vs. the old ~12 minutes cold).

name: CI

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ 'v*' ]   # tags trigger the release workflow, not CI
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel any superseded run on the same ref so we never waste a runner
# on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint + assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure Gradle (configuration cache + parallel + build cache)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.configuration-cache=true
          org.gradle.configuration-cache.problems=warn
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
          org.gradle.daemon=true
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Run lint + assembleDebug in parallel
        run: ./gradlew lintDebug assembleDebug --no-daemon --stacktrace

      - name: Print APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN{printf "%.2f", b/1024/1024}')
          echo "::notice::Debug APK size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ViperCode-debug-CI-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ViperCode-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
