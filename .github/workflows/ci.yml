name: CI

# Runs on every push and pull request so build/compile errors are
# caught BEFORE a release is published. The release workflow
# (.github/workflows/build-release-apk.yml) is then guaranteed to
# succeed because the same compile step has already passed.
#
# v0.0.9 changes:
#  - Add a `lint-baseline.xml` allow-list step (no-op if the file
#    doesn't exist; lets the repo silence known legacy lint warnings
#    without disabling the lintDebug gate).
#  - Upload the test results XML so the Actions UI shows test counts
#    inline (was hidden in the gradle log).
#  - Add `--no-daemon --build-cache` to all Gradle invocations for
#    faster cold-start on a fresh runner.
#  - Add an explicit `configure` step that prints the JDK / Android
#    SDK versions, so a green build can be reproduced locally.
#  - Add a `unit-test` job that runs in parallel with `build-debug`
#    and runs `testDebugUnitTest`. The two jobs share the same Gradle
#    cache key so they don't fight for cache slots.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Lint + assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Print toolchain versions (reproducibility aid)
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Gradle wrapper ==="
          ./gradlew --version
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms/" 2>/dev/null || true
          ls -1 "$ANDROID_HOME/build-tools/" 2>/dev/null || true

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --build-cache --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ViperCode-debug-CI-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ViperCode-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
